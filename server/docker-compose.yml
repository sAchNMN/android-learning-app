# 本地开发依赖：MySQL 8 + Redis 7（Docker 方案，可选）
# 用法：cd server && docker compose up -d
#
# 注意：本机 3306 已被 Windows 服务里的 MySQL 26.10 占用。
# 用 Docker 方案时必须把下面 mysql 的端口改成 "3307:3306"，
# 并同步修改 RuoYi-Vue/ruoyi-admin/src/main/resources/application-druid.yml 的 url 端口。
# 若直接复用本机 MySQL，则只保留 redis 服务即可。

services:
  mysql:
    image: mysql:8.0
    container_name: learning-mysql
    restart: unless-stopped
    environment:
      # 与若依 application-druid.yml 的默认密码保持一致，避免改第三方源码
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ry-vue
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: learning-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
